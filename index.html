<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Page Title & Description (Synced with HTML & Config) -->
    <title>ဝက်ကြီး — Download for Android</title>
    <meta
      name="description"
      content="Download the official ဝက်ကြီး Android package directly to your device."
    />

    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="ဝက်ကြီး — Download for Android" />
    <meta
      property="og:description"
      content="Download the official ဝက်ကြီး Android package directly to your device."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="bunner.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#140407" />

    <!-- Bold Modern Font + Myanmar Support from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ======================================================================
         1. CSS VARIABLES & RESET
         ====================================================================== */
      :root {
        --bg-outer: #0d0305;
        --bg-page: #180509;
        --bg-surface: #24080e;
        --border-subtle: rgba(251, 191, 36, 0.16);
        --navy-bar: #0a1529;
        --navy-border: rgba(255, 255, 255, 0.1);
        --text-primary: #fdf8f6;
        --text-muted: #d6c2c6;
        --gold-gradient: linear-gradient(
          135deg,
          #d97706 0%,
          #f59e0b 38%,
          #facc15 78%,
          #fde047 100%
        );
        --gold-text: #1c0a03;
        --gold-glow: rgba(250, 204, 21, 0.42);
        --bar-height: 76px;
        --font-sans: "Plus Jakarta Sans", "Noto Sans Myanmar", -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font-sans);
        background: radial-gradient(
            circle at 50% 0%,
            #330912 0%,
            var(--bg-outer) 72%
          )
          fixed;
        color: var(--text-primary);
        line-height: 1.5;
        min-height: 100dvh;
        /* Bottom padding matches fixed bar height so the bar never covers the banner */
        padding-bottom: calc(var(--bar-height) + env(safe-area-inset-bottom));
        overflow-x: hidden;
      }

      /* ======================================================================
         2. CENTERED MOBILE-FIRST CONTAINER (360px - 480px)
         ====================================================================== */
      .page-container {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        background-color: var(--bg-page);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      }

      @media (min-width: 481px) {
        .page-container {
          border-left: 1px solid var(--border-subtle);
          border-right: 1px solid var(--border-subtle);
        }
      }

      /* ======================================================================
         3. FULL-WIDTH HERO BANNER & PRIMARY DOWNLOAD CTA
         ====================================================================== */
      .hero-section {
        position: relative;
        width: 100%;
        /* Height automatically matches the banner image's natural aspect ratio */
        height: auto;
        overflow: hidden;
        background: linear-gradient(165deg, #3b0a14 0%, #160408 65%, #0c0204 100%);
      }

      .hero-section.is-fallback {
        min-height: 520px;
      }

      .hero-banner-img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Fallback visual when banner image is missing or loading fails */
      .hero-fallback {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: radial-gradient(
            circle at 50% 35%,
            rgba(245, 158, 11, 0.2) 0%,
            transparent 58%
          ),
          linear-gradient(170deg, #420b16 0%, #1a0509 75%);
      }

      .hero-section.is-fallback .hero-banner-img {
        display: none;
      }

      .hero-section.is-fallback .hero-fallback {
        display: flex;
      }

      .hero-fallback-title {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fef3c7;
      }

      /* Subtle bottom scrim ensuring the hero Download button always stands out */
      .hero-scrim {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(18, 4, 7, 0.92) 0%,
          rgba(18, 4, 7, 0.45) 32%,
          rgba(18, 4, 7, 0) 62%
        );
      }

      /* Lower-banner centered CTA wrapper */
      .hero-cta-wrap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 36px;
        display: flex;
        justify-content: center;
        padding: 0 24px;
        z-index: 2;
      }

      .hero-download-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        max-width: 280px;
        min-height: 58px;
        padding: 15px 32px;
        border-radius: 18px;
        background: var(--gold-gradient);
        color: var(--gold-text);
        font-family: var(--font-sans);
        font-size: 1.125rem;
        font-weight: 800;
        letter-spacing: 0.01em;
        text-decoration: none;
        white-space: nowrap;
        box-shadow:
          0 10px 28px rgba(0, 0, 0, 0.5),
          0 0 26px var(--gold-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
        transition:
          transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
          filter 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      /* Subtle pulse animation on outer gold glow ring (keeps tap target stable) */
      .hero-download-btn::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 22px;
        border: 2px solid rgba(250, 204, 21, 0.72);
        box-shadow: 0 0 22px rgba(250, 204, 21, 0.45);
        opacity: 0;
        pointer-events: none;
        animation: ctaRingPulse 2.2s ease-out infinite;
      }

      .hero-download-btn:hover {
        filter: brightness(1.06);
        transform: translateY(-2px);
      }

      .hero-download-btn:active {
        transform: scale(0.97);
      }

      .hero-download-btn:focus-visible,
      .bar-download-btn:focus-visible {
        outline: 3px solid #fef08a;
        outline-offset: 3px;
      }

      @keyframes ctaRingPulse {
        0% {
          transform: scale(0.98);
          opacity: 0.85;
        }
        75% {
          transform: scale(1.06, 1.18);
          opacity: 0;
        }
        100% {
          transform: scale(1.06, 1.18);
          opacity: 0;
        }
      }

      /* ======================================================================
         4. FIXED BOTTOM DOWNLOAD BAR (FULL WIDTH, DARK NAVY)
         ====================================================================== */
      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 50;
        background-color: var(--navy-bar);
        border-top: 1px solid var(--navy-border);
        box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.55);
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      }

      .bottom-bar-inner {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .app-identity {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1;
      }

      .app-icon-wrap {
        position: relative;
        width: 46px;
        height: 46px;
        flex-shrink: 0;
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(145deg, #681020 0%, #2a060d 100%);
        border: 1px solid rgba(250, 204, 21, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-icon-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .app-icon-fallback {
        display: none;
        width: 24px;
        height: 24px;
        color: #fcd34d;
      }

      .app-icon-wrap.is-fallback .app-icon-img {
        display: none;
      }

      .app-icon-wrap.is-fallback .app-icon-fallback {
        display: block;
      }

      .app-name {
        color: #ffffff;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bar-download-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        flex-shrink: 0;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 9999px;
        background: var(--gold-gradient);
        color: var(--gold-text);
        font-family: var(--font-sans);
        font-size: 0.8125rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-decoration: none;
        white-space: nowrap;
        box-shadow:
          0 4px 16px rgba(245, 158, 11, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        transition:
          transform 160ms cubic-bezier(0.16, 1, 0.3, 1),
          filter 160ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .bar-download-btn:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      .bar-download-btn:active {
        transform: scale(0.96);
      }

      /* Narrow mobile adjustment at 360px */
      @media (max-width: 374px) {
        .bottom-bar {
          padding-left: 12px;
          padding-right: 12px;
        }
        .bar-download-btn {
          padding: 10px 14px;
          font-size: 0.75rem;
        }
      }

      /* ======================================================================
         6. TOAST NOTIFICATION
         ====================================================================== */
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(var(--bar-height) + 18px + env(safe-area-inset-bottom));
        transform: translate(-50%, 16px);
        width: calc(100% - 32px);
        max-width: 448px;
        z-index: 60;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 13px 16px;
        border-radius: 14px;
        background-color: rgba(15, 23, 42, 0.96);
        border: 1px solid rgba(250, 204, 21, 0.4);
        color: #f8fafc;
        font-size: 0.84375rem;
        font-weight: 600;
        line-height: 1.4;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.6);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 200ms ease,
          transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }

      .toast-icon {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        margin-top: 2px;
        color: #facc15;
      }

      /* ======================================================================
         7. REDUCED MOTION COMPLIANCE
         ====================================================================== */
      @media (prefers-reduced-motion: reduce) {
        .hero-download-btn,
        .hero-download-btn::after {
          animation: none;
        }
        .hero-download-btn,
        .bar-download-btn,
        .toast {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-container">
      <!-- 1. Full-Width Hero Banner Section -->
      <section class="hero-section" id="heroSection">
        <img
          id="heroBannerImg"
          class="hero-banner-img"
          src=""
          alt="App promotional hero banner"
          referrerpolicy="no-referrer"
        />

        <!-- Graceful fallback if BANNER_URL is missing or unavailable -->
        <div class="hero-fallback" aria-hidden="true">
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fbbf24"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          <span class="hero-fallback-title" id="heroFallbackName">ဝက်ကြီး</span>
        </div>

        <div class="hero-scrim" aria-hidden="true"></div>

        <!-- 2. Centered Rounded Gold Download Button over Lower Banner -->
        <div class="hero-cta-wrap">
          <a
            id="heroDownloadBtn"
            class="hero-download-btn"
            href="https://pub-025bdd4f665b4e54a87bfcedeed54a91.r2.dev/Apk%20link/base%20(2).apk"
            download="ဝက်ကြီး.apk"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Download</span>
          </a>
        </div>
      </section>
    </main>

    <!-- 4. Fixed Full-Width Dark Navy Bottom Bar -->
    <aside class="bottom-bar" aria-label="App download bar">
      <div class="bottom-bar-inner">
        <!-- Left: Rounded-square App Icon & Bold White App Name -->
        <div class="app-identity">
          <div class="app-icon-wrap" id="appIconWrap">
            <img
              id="appIconImg"
              class="app-icon-img"
              src=""
              alt="App icon"
              referrerpolicy="no-referrer"
            />
            <!-- Fallback icon if ICON_URL fails to load -->
            <svg
              class="app-icon-fallback"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
          </div>
          <span class="app-name" id="appNameText">ဝက်ကြီး</span>
        </div>

        <!-- Right: Pill-Shaped Gold "DOWNLOAD APP" Button -->
        <a
          id="barDownloadBtn"
          class="bar-download-btn"
          href="https://pub-025bdd4f665b4e54a87bfcedeed54a91.r2.dev/Apk%20link/base%20(2).apk"
          download="ဝက်ကြီး.apk"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>DOWNLOAD APP</span>
        </a>
      </div>
    </aside>

    <!-- 5. Toast Notification -->
    <div
      id="downloadToast"
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      <svg
        class="toast-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span id="toastMessage"></span>
    </div>

    <script>
      /* ======================================================================
         EDITABLE CONFIGURATION BLOCK
         Replace these values to customize the banner, icon, APK link, and name.
         ====================================================================== */
      const BANNER_URL = "bunner.png";
      const APK_URL =
        "https://pub-025bdd4f665b4e54a87bfcedeed54a91.r2.dev/Apk%20link/base%20(2).apk";
      const ICON_URL = "logo.png";
      const APP_NAME = "ဝက်ကြီး";

      const NOTIFY_ENDPOINT = "/api/notify";
      const TOAST_TEXT =
        "Download starting... If blocked, allow installs from this browser in Android settings.";

      /* ======================================================================
         DOM BINDING, VISITOR TRACKING & DOWNLOAD BEHAVIOR
         ====================================================================== */
      (function initLandingPage() {
        const heroSection = document.getElementById("heroSection");
        const heroBannerImg = document.getElementById("heroBannerImg");
        const heroFallbackName = document.getElementById("heroFallbackName");
        const heroDownloadBtn = document.getElementById("heroDownloadBtn");

        const appIconWrap = document.getElementById("appIconWrap");
        const appIconImg = document.getElementById("appIconImg");
        const appNameText = document.getElementById("appNameText");
        const barDownloadBtn = document.getElementById("barDownloadBtn");

        const downloadToast = document.getElementById("downloadToast");
        const toastMessage = document.getElementById("toastMessage");

        let toastTimer = null;

        // 1. Apply config values to the page
        document.title = APP_NAME + " — Download for Android";
        appNameText.textContent = APP_NAME;
        heroFallbackName.textContent = APP_NAME;

        heroBannerImg.alt = APP_NAME + " promotional banner";
        appIconImg.alt = APP_NAME + " icon";

        // Attach fallback handlers in case image files are not present yet
        heroBannerImg.addEventListener("error", function () {
          heroSection.classList.add("is-fallback");
        });
        appIconImg.addEventListener("error", function () {
          appIconWrap.classList.add("is-fallback");
        });

        heroBannerImg.src = BANNER_URL;
        appIconImg.src = ICON_URL;

        // Bind APK_URL and download attribute to both download buttons
        const downloadButtons = [
          { el: heroDownloadBtn, label: "Hero Download" },
          { el: barDownloadBtn, label: "Bottom Bar DOWNLOAD APP" },
        ];
        downloadButtons.forEach(function (item) {
          item.el.setAttribute("href", APK_URL);
          item.el.setAttribute("download", APP_NAME + ".apk");
        });

        // 2. Persistent Visitor ID so visits and downloads can be matched
        function getVisitorId() {
          const storageKey = "wg_visitor_id";
          try {
            const existing = window.localStorage.getItem(storageKey);
            if (existing) {
              return existing;
            }
          } catch {
            // Storage unavailable in private mode
          }

          const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          let code = "V-";
          const bytes = new Uint8Array(6);
          if (window.crypto && window.crypto.getRandomValues) {
            window.crypto.getRandomValues(bytes);
          } else {
            for (let i = 0; i < bytes.length; i++) {
              bytes[i] = Math.floor(Math.random() * 256);
            }
          }
          for (let i = 0; i < bytes.length; i++) {
            code += chars[bytes[i] % chars.length];
          }

          try {
            window.localStorage.setItem(storageKey, code);
          } catch {
            // Ignore write errors
          }
          return code;
        }

        function getReferralSource() {
          try {
            const params = new URLSearchParams(window.location.search);
            return (
              params.get("ref") ||
              params.get("utm_source") ||
              params.get("source") ||
              "direct"
            );
          } catch {
            return "direct";
          }
        }

        const visitorId = getVisitorId();
        const referralSource = getReferralSource();

        // 3. Non-blocking Telegram notification helper via /api/notify
        function sendNotify(eventType, buttonLabel, useBeacon) {
          const payload = JSON.stringify({
            event: eventType,
            visitorId: visitorId,
            button: buttonLabel || "",
            ref: referralSource,
          });

          if (useBeacon && navigator.sendBeacon) {
            try {
              const blob = new Blob([payload], { type: "application/json" });
              if (navigator.sendBeacon(NOTIFY_ENDPOINT, blob)) {
                return;
              }
            } catch {
              // Fall back to fetch keepalive
            }
          }

          fetch(NOTIFY_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
            keepalive: true,
          }).catch(function () {
            // Fail silently so visitor download flow is never interrupted
          });
        }

        // Notify on page visit (once per browser session tab)
        try {
          const visitKey = "wg_visit_sent";
          if (!window.sessionStorage.getItem(visitKey)) {
            window.sessionStorage.setItem(visitKey, "1");
            sendNotify("visit", "", false);
          }
        } catch {
          sendNotify("visit", "", false);
        }

        // 4. Toast helper
        function showDownloadToast() {
          toastMessage.textContent = TOAST_TEXT;
          downloadToast.classList.add("is-visible");

          if (toastTimer) {
            clearTimeout(toastTimer);
          }

          toastTimer = setTimeout(function () {
            downloadToast.classList.remove("is-visible");
          }, 4800);
        }

        // 5. Trigger toast + Telegram alert when either download button is clicked
        downloadButtons.forEach(function (item) {
          item.el.addEventListener("click", function () {
            showDownloadToast();
            sendNotify("download", item.label, true);
          });
        });
      })();
    </script>
  </body>
</html>
